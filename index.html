<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b30000">
  <title>Lettre au Père Noël</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div id="app-shell">
    <header id="app-header" class="sticky-header" role="banner">
      <button id="btn-home" class="icon-btn" aria-label="Retour à l'accueil" hidden>
        <span aria-hidden="true">←</span>
      </button>
      <h1 id="app-title">Lettre au Père Noël</h1>
      <button id="btn-menu" class="icon-btn" aria-label="Menu du profil" aria-haspopup="menu" hidden>
        <span aria-hidden="true">⋮</span>
      </button>
    </header>

    <main id="view-root" role="main"></main>

    <div id="toast-region" role="status" aria-live="polite"></div>
    <div id="modal-region" role="dialog" aria-modal="true" hidden></div>
    <div id="progress-region" hidden></div>
    <div id="santa-stage" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
