<!doctype html>
<html lang="fr" data-theme="classique">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Lipeno – Ma liste au Père Noël</title>
  <meta name="description" content="La liste de cadeaux de Noël des enfants, en photos.">
  <meta name="theme-color" content="#b1262b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lipeno">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Applique le thème avant l'affichage pour éviter un flash de couleurs
    try {
      var s = JSON.parse(localStorage.getItem('lipeno.settings') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <main id="app" aria-live="polite"></main>
  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
